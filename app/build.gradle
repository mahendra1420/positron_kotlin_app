plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-android'
}

android {
    namespace 'com.positron.teachers'
    signingConfigs {
        debug {
            storeFile file('D:\\kotlin_project\\Positron\\Teacher\\app\\erptron.jks')
            storePassword '123456'
            keyPassword '123456'
            keyAlias 'erptron'
        }
        release {
            storeFile file('D:\\kotlin_project\\Positron\\Teacher\\app\\erptron.jks')
            storePassword '123456'
            keyPassword '123456'
            keyAlias 'erptron'
        }
    }
    compileSdk 35
    defaultConfig {
        applicationId "com.positron.teachers"
        minSdk 21
        targetSdk 35
        versionCode 16
        versionName "16.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug
        signingConfig signingConfigs.debug
    }
    buildFeatures {
        dataBinding = true
        viewBinding true
//        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'prog885uard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug{
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
    lint {
        abortOnError = false
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // FireBase Messaging Services
    implementation 'com.google.firebase:firebase-messaging:24.1.0'

    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    implementation 'com.google.android.gms:play-services-auth:20.7.0'


    implementation 'com.google.android.gms:play-services-drive:17.0.0'
    implementation 'com.google.firebase:firebase-auth-ktx:21.0.2'

    implementation("com.google.firebase:firebase-crashlytics:18.4.3")
    implementation("com.google.firebase:firebase-analytics:21.3.0")

    //implementation 'com.google.apis:google-api-services-drive:v3-rev20240111-1.35.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'
    implementation 'com.google.api-client:google-api-client:2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.11.0'
    implementation 'com.google.http-client:google-http-client-gson:1.39.0'

    implementation 'com.google.api-client:google-api-client-android:1.23.0'

    implementation 'com.google.code.gson:gson:2.9.1'

    //implementation 'com.google.api-client:google-api-client:1.35.2'

    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    implementation 'com.github.bumptech.glide:glide:4.12.0'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.17'
  //  implementation 'com.google.android.play:app-update:2.1.0'

  //  implementation 'com.google.android.play:core:1.10.3'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //otpview
    implementation 'com.github.mukeshsolanki.android-otpview-pinview:otpview:3.1.0'

    //biometric
    implementation 'androidx.biometric:biometric:1.1.0'

}
configurations.all {
    exclude module: "play-services-safetynet"
}